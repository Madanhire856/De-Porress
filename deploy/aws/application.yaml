AWSTemplateFormatVersion: '2010-09-09'
Description: De Porres ECS Fargate, HTTPS ALB and persistent authentication keys in an existing VPC. Creates billable resources.
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  PublicSubnetA: {Type: 'AWS::EC2::Subnet::Id'}
  PublicSubnetB: {Type: 'AWS::EC2::Subnet::Id'}
  PrivateSubnetA: {Type: 'AWS::EC2::Subnet::Id'}
  PrivateSubnetB: {Type: 'AWS::EC2::Subnet::Id'}
  AlbSubnetCidrA: {Type: String, Description: 'CIDR of PublicSubnetA, trusted for proxy headers'}
  AlbSubnetCidrB: {Type: String, Description: 'CIDR of PublicSubnetB, trusted for proxy headers'}
  CertificateArn: {Type: String, Description: ACM certificate ARN in this region}
  Hostname: {Type: String, Description: Public HTTPS hostname without scheme or path}
  ImageUri: {Type: String, Description: Existing private ECR image URI with immutable release tag}
  RuntimeSecretArn: {Type: String, Description: Secrets Manager JSON containing CognitoClientSecret and DatabaseConnectionString}
  DatabaseSecurityGroupId: {Type: 'AWS::EC2::SecurityGroup::Id'}
  BootstrapAdminEmail: {Type: String, Default: ''}
  CognitoAuthority:
    Type: String
    Default: https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_LOhGBF9su
  CognitoClientId: {Type: String, Default: 6ulsn0evv7q8qmoeo69al441sg}
  CognitoDomain:
    Type: String
    Default: https://eu-north-1lohgbf9su.auth.eu-north-1.amazoncognito.com
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
    Description: Start at zero; run the migration task before setting to one.
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App traffic only from its load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 1433
      ToPort: 1433
      SourceSecurityGroupId: !Ref TaskSecurityGroup
  KeysSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS access from app tasks only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref TaskSecurityGroup
  KeysFileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      BackupPolicy: {Status: ENABLED}
      FileSystemPolicy:
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 'elasticfilesystem:Client*'
            Resource: '*'
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  KeysAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref KeysFileSystem
      PosixUser: {Uid: '1654', Gid: '1654'}
      RootDirectory:
        Path: /de-porres/keys
        CreationInfo: {OwnerUid: '1654', OwnerGid: '1654', Permissions: '0700'}
  KeysMountA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref KeysFileSystem
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups: [!Ref KeysSecurityGroup]
  KeysMountB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref KeysFileSystem
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups: [!Ref KeysSecurityGroup]
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {RetentionInDays: 30}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: RuntimeSecret
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeSecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StaffInvitations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['cognito-idp:AdminCreateUser', 'cognito-idp:AdminGetUser']
                Resource: !Sub
                  - 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${PoolId}'
                  - PoolId: !Select [3, !Split ['/', !Ref CognitoAuthority]]
        - PolicyName: AuthenticationKeys
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ['elasticfilesystem:ClientMount', 'elasticfilesystem:ClientWrite']
                Resource: !GetAtt KeysFileSystem.Arn
                Condition:
                  StringEquals: {'elasticfilesystem:AccessPointArn': !GetAtt KeysAccessPoint.Arn}
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: keys
          EFSVolumeConfiguration:
            FilesystemId: !Ref KeysFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref KeysAccessPoint, IAM: ENABLED}
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8080}]
          MountPoints: [{SourceVolume: keys, ContainerPath: /keys, ReadOnly: false}]
          Environment:
            - {Name: ASPNETCORE_ENVIRONMENT, Value: Production}
            - {Name: ASPNETCORE_HTTP_PORTS, Value: '8080'}
            - {Name: Cognito__Authority, Value: !Ref CognitoAuthority}
            - {Name: Cognito__ClientId, Value: !Ref CognitoClientId}
            - {Name: Cognito__Domain, Value: !Ref CognitoDomain}
            - {Name: Cognito__InvitationsEnabled, Value: 'true'}
            - {Name: Cognito__LogoutUri, Value: !Sub 'https://${Hostname}/'}
            # ALB health checks send the target IP as Host. Public host filtering
            # is enforced by the HTTPS listener rule below instead.
            - {Name: AllowedHosts, Value: '*'}
            - {Name: Authentication__BootstrapAdminEmail, Value: !Ref BootstrapAdminEmail}
            - {Name: ReverseProxy__KnownNetworks__0, Value: !Ref AlbSubnetCidrA}
            - {Name: ReverseProxy__KnownNetworks__1, Value: !Ref AlbSubnetCidrB}
          Secrets:
            - Name: Cognito__ClientSecret
              ValueFrom: !Sub '${RuntimeSecretArn}:CognitoClientSecret::'
            - Name: ConnectionStrings__SMSDb
              ValueFrom: !Sub '${RuntimeSecretArn}:DatabaseConnectionString::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      Matcher: {HttpCode: '200'}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown host}
  HostListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions: [{Field: host-header, Values: [!Ref Hostname]}]
      Actions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Host: !Ref Hostname, Port: '443', StatusCode: HTTP_301}
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HostListenerRule, KeysMountA, KeysMountB, DatabaseIngress]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - {ContainerName: web, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup}
Outputs:
  LoadBalancerDns: {Value: !GetAtt LoadBalancer.DNSName}
  ClusterName: {Value: !Ref Cluster}
  ServiceName: {Value: !GetAtt Service.Name}
  TaskDefinitionArn: {Value: !Ref Task}
  TaskSecurityGroupId: {Value: !Ref TaskSecurityGroup}
  LogGroup: {Value: !Ref Logs}
